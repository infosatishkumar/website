name: Build Karishma for macOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'karishma/**'
      - '.github/workflows/karishma-mac.yml'

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: karishma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: karishma/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build Intel (x64) and Apple Silicon apps
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Karishma-macOS
          path: |
            karishma/dist/*.dmg
            karishma/dist/*.zip
          if-no-files-found: error
          retention-days: 30
