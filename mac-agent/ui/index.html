<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="state-sleeping">
  <main class="card">
    <header class="pywebview-drag-region">
      <div class="brand">
        <span class="dot"></span>
        <span id="agent-name">Karishma</span>
      </div>
      <div class="window-buttons">
        <button id="btn-settings" title="Settings" aria-label="Settings">⚙︎</button>
        <button id="btn-min" title="Minimize" aria-label="Minimize">–</button>
        <button id="btn-close" title="Quit" aria-label="Quit">✕</button>
      </div>
    </header>

    <section class="stage">
      <button id="orb" class="orb" title="Click karke baat karein" aria-label="Talk">
        <span class="halo"></span>
        <span class="ring"></span>
        <span class="core"></span>
        <span id="lottie" class="lottie"></span>
      </button>
      <p id="status" class="status">“Karishma” boliye</p>
      <p id="detail" class="detail"></p>
    </section>

    <section id="log" class="log" aria-live="polite"></section>

    <footer>
      <button id="btn-mic" class="icon-btn" title="Mic on/off" aria-label="Mic on/off">🎙</button>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="Type karein ya bolein…" />
      </form>
      <button id="btn-stop" class="icon-btn" title="Stop" aria-label="Stop">■</button>
    </footer>
  </main>

  <div id="settings" class="sheet hidden" role="dialog" aria-label="Settings">
    <div class="sheet-body">
      <h2>Settings</h2>
      <label>Claude API key <span id="key-hint" class="hint"></span>
        <input id="s-api_key" type="password" placeholder="sk-ant-…" autocomplete="off" />
      </label>
      <div class="row">
        <label>Agent ka naam<input id="s-agent_name" /></label>
        <label>Wake word<input id="s-wake_word" /></label>
      </div>
      <label>Aapka naam<input id="s-user_name" /></label>
      <div class="row">
        <label>Voice<select id="s-voice"></select></label>
        <label>Speed<input id="s-speech_rate" type="number" min="120" max="260" step="5" /></label>
      </div>
      <div class="row">
        <label>Sunne ki bhasha
          <select id="s-stt_language">
            <option value="en-IN">Hinglish / English (India)</option>
            <option value="hi-IN">Hindi (हिंदी)</option>
            <option value="en-US">English (US)</option>
          </select>
        </label>
        <label>Follow-up time (sec)<input id="s-conversation_timeout" type="number" min="5" max="120" /></label>
      </div>
      <div class="row">
        <label>Model
          <select id="s-model">
            <option value="claude-opus-5">Claude Opus 5 (best)</option>
            <option value="claude-sonnet-5">Claude Sonnet 5 (faster, cheaper)</option>
          </select>
        </label>
        <label>Effort
          <select id="s-effort">
            <option value="low">Low (fast)</option>
            <option value="medium">Medium</option>
            <option value="high">High (smart)</option>
          </select>
        </label>
      </div>
      <label class="check"><input id="s-speak_replies" type="checkbox" /> Jawab bol kar sunao</label>
      <div class="sheet-actions">
        <button id="btn-test-voice" type="button" class="ghost">🔊 Test voice</button>
        <button id="btn-workspace" type="button" class="ghost">📁 Files</button>
        <button id="btn-clear" type="button" class="ghost">🧹 New chat</button>
      </div>
      <div class="sheet-actions">
        <button id="btn-cancel" type="button" class="ghost">Cancel</button>
        <button id="btn-save" type="button" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="lottie_light.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
