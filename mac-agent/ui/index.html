<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="state-sleeping">
  <!-- Floating desktop widget: just the animation. Click = talk, drag = move, right-click = menu. -->
  <div id="orb" class="orb pywebview-drag-region" title="Click: baat karein · Right-click: menu">
    <span class="glow"></span>
    <span id="lottie" class="lottie"></span>
  </div>

  <div id="caption" class="caption hidden" aria-live="polite"></div>

  <form id="composer" class="composer hidden">
    <input id="input" autocomplete="off" placeholder="Type karein, Enter dabayein…" />
  </form>

  <div id="menu" class="menu hidden" role="menu">
    <button data-action="talk">🎙  Baat karein</button>
    <button data-action="type">⌨️  Type karein</button>
    <button data-action="stop">■  Rok do</button>
    <button data-action="mic" id="menu-mic">🔇  Mic band karein</button>
    <hr />
    <button data-action="files">📁  Banaye gaye files</button>
    <button data-action="settings">⚙︎  Settings</button>
    <button data-action="hide">–  Chhupa do</button>
    <button data-action="quit">✕  Band karein</button>
  </div>

  <script src="lottie_light.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
